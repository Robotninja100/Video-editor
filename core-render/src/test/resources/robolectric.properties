# Robolectric 4.14.1 heeft geen SDK-jar voor API 36, en zonder deze regel pakt
# hij compileSdk — dan valt hij om op `DefaultSdkPicker: IllegalArgumentException`
# nog voordat er één test draait.
#
# 34 en niet 35: 35 is net binnen wat 4.14.1 kent, en dichter op de rand gaan
# levert bij de volgende compileSdk-bump precies dezelfde stille breuk op. Wat
# hier getoetst wordt — de vertaling naar Media3 en de meetlat van de spike —
# hangt nergens aan een API-niveau boven minSdk 31.
sdk=34
