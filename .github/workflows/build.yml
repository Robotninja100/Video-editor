name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Alleen de pure-JVM modules; de Android-modules bestaan nog niet.
      # Zie docs/CHECKLIST.md.
      - name: Bouwen en testen
        run: ./gradlew build --stacktrace

      - name: Testrapport bewaren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testrapport
          path: "*/build/reports/tests/test"
