name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Geen daemon in CI: de runner is er na één build toch weer klaar mee, en een
  # daemon die blijft hangen kost alleen geheugen.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Statische analyse draait apart van de tests: het is een andere soort fout,
  # het duurt kort, en zo zie je in één oogopslag welke van de twee stuk is.
  analyse:
    name: Statische analyse (detekt + ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Alleen builds op main vullen de gedeelde cache; pull requests lezen
          # hem. Dat voorkomt dat één tak de cache van iedereen vervuilt.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `--continue` zodat één module die struikelt niet verbergt wat er in de
      # acht andere aan de hand is. De stap faalt hoe dan ook zodra er iets
      # buiten de basislijn uit komt.
      - name: Detekt
        run: ./gradlew detekt --continue

      - name: Samenvatting statische analyse
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET, collections, os

          bevindingen = []
          for pad in glob.glob('*/build/reports/detekt/detekt.xml'):
              for bestand in ET.parse(pad).getroot().iter('file'):
                  # `basePath` maakt de paden al relatief; een absoluut pad
                  # (oudere detekt, andere instelling) korten we alsnog in.
                  naam = bestand.get('name')
                  if os.path.isabs(naam):
                      naam = os.path.relpath(naam, os.getcwd())
                  for fout in bestand.iter('error'):
                      bevindingen.append((naam, fout.get('line'),
                                          fout.get('source', '').split('.')[-1],
                                          fout.get('message', '')))

          print('## Statische analyse\n')
          if not bevindingen:
              print('Geen nieuwe bevindingen. Bestaande overtredingen staan in '
                    '`config/detekt/baseline-*.xml`.')
          else:
              print(f'**{len(bevindingen)} nieuwe bevinding(en)** buiten de basislijn om.\n')
              print('| Regel | Aantal |')
              print('| --- | ---: |')
              for regel, aantal in collections.Counter(b[2] for b in bevindingen).most_common():
                  print(f'| `{regel}` | {aantal} |')
              print('\n<details><summary>Alle bevindingen</summary>\n')
              print('| Plek | Regel | Melding |')
              print('| --- | --- | --- |')
              for naam, lijn, regel, melding in sorted(bevindingen)[:200]:
                  melding = melding.replace('|', r'\|')[:160]
                  print(f'| `{naam}:{lijn}` | `{regel}` | {melding} |')
              print('\n</details>')
          PY

      # Het rapport is een hulpmiddel, geen poort. De detekt-stap hierboven
      # bepaalt of de build slaagt; een haperende artifact-upload van GitHub
      # hoort een groene analyse niet rood te maken.
      - name: Detekt-rapporten bewaren
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '*/build/reports/detekt/'
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: Unittests en dekking (pure JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # De Android-modules doen hier niet mee: settings.gradle.kts neemt ze
      # alleen op als er een local.properties met sdk.dir staat, en die schrijft
      # alleen de apk-job hieronder. Deze job blijft dus pure JVM.
      #
      # `:koverXmlReport` mét dubbele punt is het samengevoegde rapport van het
      # hoofdproject; zonder die punt zou elke module ook nog zijn eigen rapport
      # schrijven. `:koverVerify` bewaakt de ondergrens voor de regeldekking en
      # maakt de build rood zodra die eronder zakt.
      - name: Test en dekking
        run: ./gradlew test :koverXmlReport :koverVerify --continue

      - name: Samenvatting testresultaten
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET, collections

          per_module = collections.defaultdict(collections.Counter)
          mislukt = []

          for pad in glob.glob('*/build/test-results/test/TEST-*.xml'):
              module = pad.split('/')[0]
              wortel = ET.parse(pad).getroot()
              suites = [wortel] if wortel.tag == 'testsuite' else list(wortel.iter('testsuite'))
              for suite in suites:
                  teller = per_module[module]
                  teller['tests'] += int(suite.get('tests', 0))
                  teller['fouten'] += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
                  teller['overgeslagen'] += int(suite.get('skipped', 0))
                  teller['tijd'] += float(suite.get('time') or 0)
                  for geval in suite.iter('testcase'):
                      for soort in ('failure', 'error'):
                          for f in geval.findall(soort):
                              mislukt.append((module, geval.get('classname', ''),
                                              geval.get('name', ''), f.get('message') or ''))

          totaal = sum(t['tests'] for t in per_module.values())
          fouten = sum(t['fouten'] for t in per_module.values())
          overgeslagen = sum(t['overgeslagen'] for t in per_module.values())

          print(f"## {'Tests mislukt' if fouten else 'Tests geslaagd'}: "
                f'{totaal - fouten - overgeslagen} van {totaal}\n')
          if not per_module:
              print('Geen testresultaten gevonden.')
          else:
              print('| Module | Tests | Fouten | Overgeslagen | Tijd |')
              print('| --- | ---: | ---: | ---: | ---: |')
              for module in sorted(per_module):
                  t = per_module[module]
                  print(f"| `{module}` | {t['tests']} | {t['fouten']} | "
                        f"{t['overgeslagen']} | {t['tijd']:.1f}s |")
              print(f'| **totaal** | **{totaal}** | **{fouten}** | **{overgeslagen}** | |')

          if mislukt:
              print('\n### Mislukte tests\n')
              for module, klasse, naam, melding in mislukt[:50]:
                  print(f'- `{module}` · `{klasse}` · **{naam}**')
                  if melding:
                      eerste = melding.replace('|', r'\|').splitlines()[0][:200]
                      print(f'  <br>`{eerste}`')
          PY

      - name: Samenvatting dekking
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET

          pad = 'build/reports/kover/report.xml'
          print('\n## Dekking\n')
          if not os.path.exists(pad):
              print('Geen dekkingsrapport gevonden.')
          else:
              wortel = ET.parse(pad).getroot()
              tellers = {t.get('type'): (int(t.get('covered')), int(t.get('missed')))
                         for t in wortel.findall('counter')}
              namen = [('LINE', 'Regels'), ('BRANCH', 'Vertakkingen'),
                       ('INSTRUCTION', 'Instructies'), ('METHOD', 'Methoden'),
                       ('CLASS', 'Klassen')]
              print('| Maat | Gedekt | Totaal | Percentage |')
              print('| --- | ---: | ---: | ---: |')
              for sleutel, naam in namen:
                  if sleutel not in tellers:
                      continue
                  gedekt, gemist = tellers[sleutel]
                  som = gedekt + gemist
                  pct = (100.0 * gedekt / som) if som else 0.0
                  print(f'| {naam} | {gedekt} | {som} | {pct:.1f}% |')
          PY

      # Zie hierboven: de testresultaten staan al in de samenvatting, dus een
      # mislukte upload mag het oordeel over de tests niet overschrijven.
      - name: Testrapport en dekking bewaren
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            */build/reports/tests/test
            */build/test-results/test
            build/reports/kover
          retention-days: 7
          if-no-files-found: ignore

  # De derde job, en de enige die een Android SDK nodig heeft. Deze omgeving kan
  # `dl.google.com` niet bereiken, dus dit is de plek waar de Android-code voor
  # het eerst langs een compiler gaat. Verwacht dat hier fouten uit komen die de
  # andere twee jobs per definitie niet kunnen zien.
  apk:
    name: Android-build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # TIJDELIJK: alleen nodig voor de release-stap onderaan, die er na één run
    # weer uit gaat. Terugzetten naar de standaard (alleen lezen) hoort bij het
    # verwijderen van die stap.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Zorgt voor cmdline-tools en geaccepteerde licenties; AGP haalt daarna
      # zelf het platform en de build-tools op die app/build.gradle.kts vraagt.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Dít zet de Android-modules aan. Zie settings.gradle.kts: zonder sdk.dir
      # doen ze niet mee, zodat een machine zonder SDK de rest gewoon kan bouwen.
      - name: Android-modules aanzetten
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Goedkope controle dat `controle` ook een geldige takengrafiek oplevert
      # zodra de Android-modules meedoen. Die opdracht vroeg eerder om
      # `:app:detekt`, een taak die niet bestaat — en dat merkte je pas op de
      # enige machine waar je hem wilde draaien. `--dry-run` bouwt de grafiek
      # zonder iets uit te voeren.
      - name: Takengrafiek van `controle` met Android erbij
        run: ./gradlew controle --dry-run

      - name: APK bouwen
        run: set -o pipefail && ./gradlew :app:assembleDebug 2>&1 | tee build.log

      # Kotlin-fouten staan verspreid door duizenden regels Gradle-uitvoer. Deze
      # samenvatting zet ze op één plek, zodat een ronde reparaties beginnen kan
      # bij lezen in plaats van bij zoeken.
      - name: Samenvatting compileerfouten
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, re, collections

          if not os.path.exists('build.log'):
              print('## Android-build\n\nGeen build-log gevonden.')
              raise SystemExit

          tekst = open('build.log', errors='replace').read()
          # Kotlin: `e: file:///pad/Bestand.kt:12:5 melding`
          kotlin = re.findall(r'^e: file://(\S+?):(\d+):(\d+) (.*)$', tekst, re.MULTILINE)
          # AGP/AAPT en overige harde fouten.
          overig = [r for r in re.findall(r'^(?:ERROR|FAILURE):? (.*)$', tekst, re.MULTILINE)]

          print('## Android-build\n')
          if not kotlin and not overig:
              print('Geen compileerfouten gevonden.')
          else:
              if kotlin:
                  print(f'**{len(kotlin)} Kotlin-fout(en)**, verdeeld over de bestanden:\n')
                  print('| Bestand | Aantal |')
                  print('| --- | ---: |')
                  teller = collections.Counter(os.path.relpath(p, os.getcwd()) if os.path.isabs(p)
                                               else p for p, _, _, _ in kotlin)
                  for naam, aantal in teller.most_common():
                      print(f'| `{naam}` | {aantal} |')
                  print('\n| Plek | Melding |')
                  print('| --- | --- |')
                  for pad, lijn, kolom, melding in kotlin[:200]:
                      naam = os.path.relpath(pad, os.getcwd()) if os.path.isabs(pad) else pad
                      print(f"| `{naam}:{lijn}:{kolom}` | {melding.replace('|', chr(92) + '|')[:200]} |")
              if overig:
                  print('\n### Overige fouten\n')
                  for regel in overig[:30]:
                      print(f"- {regel.replace('|', chr(92) + '|')[:250]}")
          PY

      - name: APK bewaren
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      # TIJDELIJK, gaat er na één run weer uit.
      #
      # Een artefact is alleen te downloaden als je ingelogd bent en het komt als
      # zip binnen — op een telefoon twee stappen te veel. Een release-asset is
      # een directe link naar het .apk-bestand. Deze stap draait hier en niet
      # lokaal omdat de omgeving waarin dit geschreven is de blob-opslag van
      # GitHub niet mag benaderen (403 op organisatiebeleid), en de APK dus niet
      # kan ophalen om zelf te uploaden.
      - name: APK eenmalig als release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          korte=$(git rev-parse --short HEAD)
          gh release create "apk-$korte" \
            app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "Testbuild $korte" \
            --notes "Debug-build van commit $korte, rechtstreeks van de CI.

          Niet ondertekend voor distributie en niet geoptimaliseerd — bedoeld om
          op een toestel te testen, niet om te verspreiden. Android vraagt bij het
          installeren eenmalig om 'installeren van onbekende apps toestaan'.

          Wat werkt: de app vraagt bij het starten om een video, zet die op de
          tijdlijn en speelt hem af. Wat nog niet bewezen is, staat in
          docs/BOUWPLAN.md onder Verificatie — daar is een toestel voor nodig."

      - name: Build-log bewaren
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
